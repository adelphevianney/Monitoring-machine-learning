---
# =============================================================================
# Stack MLOps — Drift Monitoring
# =============================================================================
#
# SERVICES :
#   postgres          : base de données partagée (Airflow + tables applicatives)
#   minio             : data lake objet (datasets, artefacts, snapshots)
#   minio-init        : crée les buckets au démarrage (one-shot)
#   airflow-init      : initialise la base Airflow + crée l'utilisateur admin
#   airflow-webserver : interface web Airflow
#   airflow-scheduler : exécute les DAGs
#
# DÉMARRAGE :
#   docker-compose up -d
#
# ACCÈS :
#   Airflow UI  : http://localhost:8080  (admin / admin)
#   MinIO UI    : http://localhost:9001  (minioadmin / minioadmin)
#   Postgres    : localhost:5432         (mlops / mlops)
#
# ARRÊT + NETTOYAGE :
#   docker-compose down -v
# =============================================================================

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW_CONN_POSTGRES_MLOPS: postgresql://mlops:mlops@postgres:5432/mlops
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"

    # Postgres applicatif (base mlops)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: mlops
    POSTGRES_USER: mlops
    POSTGRES_PASSWORD: mlops

    # MinIO
    MINIO_ENDPOINTS: http://mlops-minio:9000
    MINIO_ENDPOINT: mlops-minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin

    # Variables Airflow pour les DAGs
    AIRFLOW_VAR_MODEL_NAME: drift_regressor
    AIRFLOW_VAR_MIN_R2_FOR_REGISTRY: "0.70"
    AIRFLOW_VAR_N_ROWS_TRAINING: "5000"
    AIRFLOW_VAR_N_ROWS_MONITORING: "1000"
    AIRFLOW_VAR_DRIFT_SIMULATION_FACTOR: "0.0"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - airflow-logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy


services:

  # ===========================================================================
  # POSTGRES
  #
  # Ordre d'exécution de docker-entrypoint-initdb.d/ (alphabétique) :
  #   1_init_databases.sh   → crée les bases airflow et mlops avec leurs users
  #   2_app_tables.sql      → crée les tables applicatives dans la base mlops
  #
  # IMPORTANT : le préfixe numérique garantit l'ordre d'exécution.
  # app_tables.sql doit impérativement tourner APRÈS la création de la base mlops.
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "airflow:airflow:airflow,mlops:mlops:mlops"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 1 — crée les bases et users (doit tourner en premier)
      - ./src/db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/1_init_databases.sh
      # 2 — crée les tables applicatives dans la base mlops (doit tourner après)
      - ./sql/app_tables.sql:/docker-entrypoint-initdb.d/2_app_tables.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # MINIO
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: mlops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # MINIO INIT — crée tous les buckets (one-shot)
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://mlops-minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/models;
        mc mb --ignore-existing local/raw-datasets;
        mc mb --ignore-existing local/processed-datasets;
        mc mb --ignore-existing local/feature-stats;
        mc mb --ignore-existing local/monitoring-snapshots;
        echo 'Buckets créés.';
      "
    restart: "no"

  # ===========================================================================
  # AIRFLOW INIT
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: mlops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username airflow \
          --firstname Admin \
          --lastname MLOps \
          --role Admin \
          --email admin@mlops.local \
          --password airflow
        echo "Airflow initialisé."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
    restart: "no"

  # ===========================================================================
  # AIRFLOW WEBSERVER
  # ===========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: mlops-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # AIRFLOW SCHEDULER
  # ===========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped


# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  airflow-logs:
    driver: local