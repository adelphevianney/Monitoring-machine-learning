---
# =============================================================================
# Stack MLOps v2 — Drift Monitoring + Elasticsearch + Kibana + MLflow
# =============================================================================
#
# ACCÈS :
#   Airflow UI      : http://localhost:8080  (admin / admin)
#   MLflow UI       : http://localhost:5000
#   MinIO UI        : http://localhost:9001  (minioadmin / minioadmin)
#   Kibana UI       : http://localhost:5601
#   Elasticsearch   : http://localhost:9200
#   Postgres        : localhost:5432         (mlops / mlops)
#
# DÉMARRAGE :   docker-compose up -d
# NETTOYAGE :   docker-compose down -v
# =============================================================================

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"

    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: mlops
    POSTGRES_USER: mlops
    POSTGRES_PASSWORD: mlops
    MINIO_ENDPOINTS: http://mlops-minio:9000
    MINIO_ENDPOINT: mlops-minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    MLFLOW_TRACKING_URI: http://mlops-mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://mlops-minio:9000
    ELASTICSEARCH_URL: http://mlops-elasticsearch:9200

    AIRFLOW_VAR_MODEL_NAME: drift_regressor
    AIRFLOW_VAR_MODEL_TYPE: random_forest
    AIRFLOW_VAR_MIN_R2_FOR_REGISTRY: "0.70"
    AIRFLOW_VAR_N_ROWS_TRAINING: "5000"
    AIRFLOW_VAR_N_ROWS_MONITORING: "1000"
    # 0.0=stable → 1.0=drift total. Modifier depuis Airflow Admin > Variables.
    AIRFLOW_VAR_DRIFT_SIMULATION_FACTOR: "0.0"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - airflow-logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    mlflow:
      condition: service_healthy


services:

  # ===========================================================================
  # POSTGRES
  # Ordre d'exécution docker-entrypoint-initdb.d/ (alphabétique) :
  #   1_init_databases.sh → crée airflow + mlops avec leurs users
  #   2_app_tables.sql    → crée les tables applicatives dans mlops
  # ===========================================================================
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: "airflow:airflow:airflow,mlops:mlops:mlops"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # MINIO
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: mlops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # MINIO INIT — crée tous les buckets (one-shot)
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://mlops-minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/models;
        mc mb --ignore-existing local/raw-datasets;
        mc mb --ignore-existing local/processed-datasets;
        mc mb --ignore-existing local/feature-stats;
        mc mb --ignore-existing local/monitoring-snapshots;
        mc mb --ignore-existing local/mlflow-artifacts;
        echo 'Buckets créés.';
      "
    networks:
      - mlops-network
    restart: "no"

  # ===========================================================================
  # MLFLOW — tracking server + model registry
  # Backend : Postgres (base mlops)
  # Artefacts : MinIO bucket mlflow-artifacts
  # ===========================================================================
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlops-mlflow
    command: >
      mlflow server
        --backend-store-uri postgresql://mlops:mlops@postgres/mlops
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://mlops-minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # ELASTICSEARCH — indexation des métriques de drift
  # Mode single-node, sécurité désactivée (dev local)
  # Index créés par es_client.py au premier run du monitoring :
  #   drift-monitoring-runs    : résultat global par fenêtre d'observation
  #   drift-feature-metrics    : détail par feature
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: mlops-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # KIBANA — dashboard de visualisation du drift
  # Importer le dashboard : src/kibana/dashboards/drift_dashboard.ndjson
  #   Stack Management > Saved Objects > Import
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: mlops-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://mlops-elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # AIRFLOW INIT
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: mlops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname MLOps \
          --role Admin \
          --email admin@mlops.local \
          --password admin
        echo "Airflow initialisé."
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - mlops-network
    restart: "no"

  # ===========================================================================
  # AIRFLOW WEBSERVER
  # ===========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: mlops-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlops-network
    restart: unless-stopped

  # ===========================================================================
  # AIRFLOW SCHEDULER
  # ===========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlops-network
    restart: unless-stopped


# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  airflow-logs:
    driver: local
  elasticsearch-data:
    driver: local

# =============================================================================
# NETWORK
# =============================================================================
networks:
  mlops-network:
    driver: bridge